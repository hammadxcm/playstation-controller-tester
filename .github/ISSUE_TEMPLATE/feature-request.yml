name: Feature request
description: Suggest a test or a controller to support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to test or see?
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Protocol docs, other tools that do it, controller model numbers.
